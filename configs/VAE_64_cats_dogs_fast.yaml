model:
  type: VAE
  in_channels: 3
  image_size: 64
  hidden_dims: [32, 64, 128, 256]
  latent_dim: 128

data:
  cache_dir: preprocessed64/train
  image_size: 64
  augmentation: false
  only_cats: false
  train_fraction: 0.85
  val_fraction: 0.1
  test_fraction: 0.05

training:
  epochs: 15
  batch_size: 128
  lr: 0.0001
  workers: 4
  seed: 42
  early_stopping_patience: 3
  kl_weight: 0.00005
  sample_every: 5
  num_sample_images: 16
  out_dir: results
