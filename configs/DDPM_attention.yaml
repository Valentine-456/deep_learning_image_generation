model:
  type: DDPM_ATTENTION
  in_channels: 3
  image_size: 64
  base_channels: 32
  channel_multipliers: [1, 2, 4, 8]
  time_dim: 256
  attention_heads: 4
  attention_resolution: 16

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02

data:
  cache_dir: preprocessed64/train
  image_size: 64
  augmentation: true
  only_cats: true
  train_fraction: 0.85
  val_fraction: 0.1
  test_fraction: 0.05

training:
  epochs: 400
  batch_size: 64
  lr: 0.0001
  min_lr: 0.000005
  beta1: 0.9
  beta2: 0.999
  workers: 4
  seed: 42
  sample_every: 20
  num_sample_images: 8
  out_dir: results
